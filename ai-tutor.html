<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep AI Tutor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .chat-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(148, 163, 184, 0.5);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <!-- Top Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow">
        AI
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight">ExamPrep AI Tutor</h1>
        <p class="text-xs text-slate-400">SSC, NTPC &amp; Govt Exam Doubt Solver</p>
      </div>
    </div>
    <button
      id="clear-chat-btn"
      type="button"
      class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
    >
      Clear Chat
    </button>
  </header>

  <!-- Main Chat Area -->
  <main class="flex-1 max-w-4xl w-full mx-auto flex flex-col p-3 sm:p-5 gap-3">
    <!-- Quick Prompts -->
    <div class="flex flex-wrap gap-2">
      <button
        type="button"
        data-prompt="SSC CGL की तैयारी के लिए 30 दिन का आसान प्लान हिंदी में बताओ।"
        class="quick-prompt text-xs px-3 py-1.5 rounded-full bg-slate-900 hover:bg-indigo-950 text-slate-300 hover:text-indigo-200 border border-slate-800 transition"
      >
        SSC 30-Day Plan
      </button>
      <button
        type="button"
        data-prompt="पाइथागोरस प्रमेय को आसान उदाहरण और शॉर्ट ट्रिक के साथ समझाओ।"
        class="quick-prompt text-xs px-3 py-1.5 rounded-full bg-slate-900 hover:bg-indigo-950 text-slate-300 hover:text-indigo-200 border border-slate-800 transition"
      >
        Pythagoras Trick
      </button>
      <button
        type="button"
        data-prompt="भारतीय संविधान के 5 सबसे महत्वपूर्ण अनुच्छेद ट्रिक से याद कराओ।"
        class="quick-prompt text-xs px-3 py-1.5 rounded-full bg-slate-900 hover:bg-indigo-950 text-slate-300 hover:text-indigo-200 border border-slate-800 transition"
      >
        GK Polity Trick
      </button>
    </div>

    <!-- Messages Container -->
    <div
      id="chat-messages"
      class="flex-1 overflow-y-auto chat-scroll rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-4 min-h-[360px] max-h-[65vh]"
    >
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">
          AI
        </div>
        <div class="rounded-2xl rounded-tl-none bg-slate-800/90 px-4 py-3 text-sm leading-relaxed text-slate-100 max-w-[85%]">
          नमस्ते! मैं आपका <b>ExamPrep AI Tutor</b> हूँ। Maths, Reasoning, GK या English का कोई भी डाउट पूछें—मैं आसान भाषा और शॉर्ट ट्रिक के साथ समझाऊँगा।
        </div>
      </div>
    </div>

    <!-- Status / Error Message Box -->
    <div id="status-box" class="hidden rounded-xl px-3.5 py-2 text-xs font-medium bg-amber-950/80 text-amber-200 border border-amber-800"></div>

    <!-- Input Form -->
    <form id="chat-form" class="flex items-end gap-2 bg-slate-900 border border-slate-800 rounded-2xl p-2.5">
      <textarea
        id="user-input"
        rows="1"
        placeholder="अपना डाउट यहाँ लिखें..."
        class="flex-1 bg-transparent text-sm text-slate-100 placeholder-slate-400 resize-none focus:outline-none px-2 py-1.5 max-h-32"
      ></textarea>
      <button
        id="send-btn"
        type="submit"
        class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white text-sm font-semibold transition shrink-0"
      >
        Send
      </button>
    </form>
  </main>

  <script>
    const WORKER_URL = 'https://gemini-proxy.rawataravindra507.workers.dev';

    const chatMessagesEl = document.getElementById('chat-messages');
    const chatFormEl = document.getElementById('chat-form');
    const userInputEl = document.getElementById('user-input');
    const sendBtnEl = document.getElementById('send-btn');
    const clearChatBtnEl = document.getElementById('clear-chat-btn');
    const statusBoxEl = document.getElementById('status-box');

    const systemInstructionText =
      'You are ExamPrep AI Tutor for Indian government exam students (SSC, Railway, State Exams). Explain concepts, math tricks, reasoning, English, and GK clearly in simple Hindi or Hinglish.';

    let conversationHistory = [];
    let isGenerating = false;

    function showStatus(message) {
      if (!message) {
        statusBoxEl.classList.add('hidden');
        statusBoxEl.textContent = '';
        return;
      }
      statusBoxEl.textContent = message;
      statusBoxEl.classList.remove('hidden');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function appendMessage(role, text) {
      const wrapper = document.createElement('div');
      wrapper.className = role === 'user' ? 'flex items-start justify-end gap-3' : 'flex items-start gap-3';

      if (role === 'user') {
        wrapper.innerHTML = `
          <div class="rounded-2xl rounded-tr-none bg-indigo-600 px-4 py-3 text-sm leading-relaxed text-white max-w-[85%] whitespace-pre-wrap">${escapeHtml(text)}</div>
          <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold shrink-0">You</div>
        `;
      } else {
        wrapper.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
          <div class="rounded-2xl rounded-tl-none bg-slate-800/90 px-4 py-3 text-sm leading-relaxed text-slate-100 max-w-[85%] whitespace-pre-wrap">${escapeHtml(text)}</div>
        `;
      }

      chatMessagesEl.appendChild(wrapper);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    async function fetchWithBackoff(url, payload, maxRetries = 3) {
      let delayMs = 1000;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.status === 429 || response.status >= 500) {
            if (attempt < maxRetries) {
              await new Promise((resolve) => setTimeout(resolve, delayMs));
              delayMs *= 2;
              continue;
            }
          }

          if (!response.ok) {
            throw new Error(`Server error (${response.status})`);
          }

          return await response.json();
        } catch (err) {
          if (attempt === maxRetries) {
            throw err;
          }
          await new Promise((resolve) => setTimeout(resolve, delayMs));
          delayMs *= 2;
        }
      }
    }

    async function sendPrompt(promptText) {
      const cleaned = (promptText || '').trim();
      if (!cleaned || isGenerating) return;

      showStatus('');
      isGenerating = true;
      sendBtnEl.disabled = true;

      appendMessage('user', cleaned);
      conversationHistory.push({
        role: 'user',
        parts: [{ text: cleaned }]
      });

      const payload = {
        contents: conversationHistory,
        systemInstruction: {
          parts: [{ text: systemInstructionText }]
        }
      };

      try {
        showStatus('AI जवाब तैयार कर रहा है...');
        const result = await fetchWithBackoff(WORKER_URL, payload);
        const replyText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!replyText) {
          throw new Error('Empty response from model');
        }

        showStatus('');
        appendMessage('model', replyText);
        conversationHistory.push({
          role: 'model',
          parts: [{ text: replyText }]
        });
      } catch (error) {
        showStatus('जवाब लाने में समस्या आई। कृपया Cloudflare में GEMINI_API_KEY और इंटरनेट जांचें।');
      } finally {
        isGenerating = false;
        sendBtnEl.disabled = false;
        userInputEl.focus();
      }
    }

    chatFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = userInputEl.value;
      userInputEl.value = '';
      userInputEl.style.height = 'auto';
      sendPrompt(val);
    });

    userInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatFormEl.dispatchEvent(new Event('submit'));
      }
    });

    userInputEl.addEventListener('input', () => {
      userInputEl.style.height = 'auto';
      userInputEl.style.height = Math.min(userInputEl.scrollHeight, 128) + 'px';
    });

    document.querySelectorAll('.quick-prompt').forEach((btn) => {
      btn.addEventListener('click', () => {
        sendPrompt(btn.dataset.prompt || '');
      });
    });

    clearChatBtnEl.addEventListener('click', () => {
      conversationHistory = [];
      chatMessagesEl.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">
            AI
          </div>
          <div class="rounded-2xl rounded-tl-none bg-slate-800/90 px-4 py-3 text-sm leading-relaxed text-slate-100 max-w-[85%]">
            चैट साफ कर दी गई है। अब आप कोई नया डाउट पूछ सकते हैं।
          </div>
        </div>
      `;
      showStatus('');
    });
  </script>
</body>
</html>
