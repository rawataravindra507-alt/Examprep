<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Prep Pro - Testbook Style</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --soft-bg: #f8fafc;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #eef2ff;
    --secondary: #0d9488;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --success: #10b981;
    --success-soft: #ecfdf5;
    --purple: #9333ea;
    --exp-bg: #fffbeb;
    --exp-border: #f59e0b;
    --exp-text: #78350f;
    --shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
  }

  [data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #334155;
    --soft-bg: #0f172a;
    --primary: #6366f1;
    --primary-hover: #818cf8;
    --primary-soft: #312e81;
    --secondary: #14b8a6;
    --danger: #f87171;
    --danger-soft: #450a0a;
    --success: #34d399;
    --success-soft: #064e3b;
    --purple: #a855f7;
    --exp-bg: #292524;
    --exp-border: #d97706;
    --exp-text: #fde68a;
    --shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; transition: background 0.2s, color 0.2s, border-color 0.2s; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { width: 100%; max-width: 600px; background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }

  /* Header & Theme Toggle */
  .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .brand { font-size: 1.25rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .icon-btn { background: var(--soft-bg); color: var(--text); border: 1px solid var(--border); padding: 6px 11px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .icon-btn:hover { border-color: var(--primary); }
  .icon-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  h1, h2 { color: var(--text); text-align: center; margin-top: 0; font-size: 1.35rem; }

  /* Home Screen */
  .btn-group { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
  .btn { padding: 16px; font-size: 1.05rem; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; text-align: left; }
  .btn-ssc { background: linear-gradient(135deg, #4f46e5, #3b82f6); }
  .btn-ntpc { background: linear-gradient(135deg, #0d9488, #10b981); }
  .btn-sub { font-size: 0.82rem; font-weight: 400; display: block; margin-top: 5px; opacity: 0.92; }

  /* Top Bar */
  .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid var(--border); padding-bottom: 12px; margin-bottom: 12px; gap: 6px; flex-wrap: wrap; }
  .exam-name { font-weight: 700; font-size: 0.95rem; }
  .top-controls { display: flex; align-items: center; gap: 6px; }
  .timer { background: var(--danger-soft); color: var(--danger); padding: 5px 10px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }
  .btn-top-submit { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.82rem; }

  /* Sectional Tabs */
  .sec-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
  .sec-tab { padding: 7px 14px; border: 1.5px solid var(--border); background: var(--soft-bg); color: var(--muted); border-radius: 20px; font-size: 0.84rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .sec-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* Question Palette */
  .palette { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; padding: 10px; background: var(--soft-bg); border-radius: 10px; border: 1px solid var(--border); }
  .p-btn { width: 34px; height: 34px; border-radius: 8px; border: 2px solid transparent; font-weight: 700; cursor: pointer; font-size: 0.86rem; }
  .p-not-visited { background: var(--border); color: var(--text); }
  .p-not-answered { background: var(--danger); color: white; }
  .p-answered { background: var(--success); color: white; }
  .p-marked { background: var(--purple); color: white; }
  .p-ans-marked { background: var(--purple); color: white; box-shadow: inset 0 -4px 0 var(--success); }
  .p-active { border-color: var(--primary); transform: scale(1.08); }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.74rem; color: var(--muted); margin-bottom: 14px; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Question & Options */
  .q-meta { display: flex; justify-content: space-between; font-size: 0.84rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .q-text { font-size: 1.06rem; font-weight: 600; margin-bottom: 15px; line-height: 1.5; }
  .option { display: block; width: 100%; padding: 12px 14px; margin-bottom: 9px; background: var(--soft-bg); border: 1.5px solid var(--border); border-radius: 10px; text-align: left; font-size: 0.95rem; cursor: pointer; color: var(--text); }
  .option.selected { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 700; }
  [data-theme="dark"] .option.selected { color: #e0e7ff; }

  /* Buttons */
  .action-btns { display: flex; gap: 8px; margin-top: 12px; }
  .act-btn { flex: 1; padding: 9px; border-radius: 8px; font-size: 0.84rem; font-weight: 700; cursor: pointer; border: 1.5px solid; background: transparent; }
  .btn-clear { border-color: var(--muted); color: var(--muted); }
  .btn-review { border-color: var(--purple); color: var(--purple); }
  .btn-review.active-mark { background: var(--purple); color: white; }

  .nav-btns { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .nav-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; color: white; font-size: 0.94rem; }
  .btn-prev { background: #64748b; }
  .btn-next { background: var(--primary); }

  /* Result Screen */
  .score-box { background: var(--success-soft); padding: 18px; border-radius: 12px; text-align: center; margin-bottom: 16px; border: 1px solid var(--success); }
  .score-num { font-size: 2.1rem; font-weight: 800; color: var(--success); }
  .stats { display: flex; justify-content: space-around; margin-top: 10px; font-size: 0.88rem; flex-wrap: wrap; gap: 8px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 0.86rem; }
  th, td { border: 1px solid var(--border); padding: 9px 6px; text-align: center; }
  th { background: var(--soft-bg); color: var(--text); }
  .sec-heading { background: var(--primary-soft); color: var(--primary); padding: 8px 12px; border-radius: 8px; font-weight: 700; margin: 14px 0 8px; font-size: 0.92rem; }
  [data-theme="dark"] .sec-heading { color: #c7d2fe; }
  .review-item { border: 1px solid var(--border); background: var(--soft-bg); padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 0.9rem; line-height: 1.5; }
  .exp-box { margin-top: 8px; padding: 9px 11px; background: var(--exp-bg); border-left: 4px solid var(--exp-border); border-radius: 6px; font-size: 0.85rem; color: var(--exp-text); }
  .correct { color: var(--success); font-weight: 700; }
  .wrong { color: var(--danger); font-weight: 700; }
  .hidden { display: none; }
</style>
</head>
<body>

<!-- 1. होम स्क्रीन -->
<div class="card" id="home-screen">
  <div class="app-header">
    <span class="brand">ExamPrep Pro</span>
    <button class="icon-btn" id="theme-btn-home" onclick="toggleTheme()">🌙 Dark</button>
  </div>
  <h1>परीक्षा का चयन करें</h1>
  <div class="btn-group">
    <button class="btn btn-ssc" onclick="startExam('ssc')">
      SSC CGL सेक्शनल मॉक टेस्ट
      <span class="btn-sub">Maths, Reasoning, GS, English | +2 / -0.5 | Bilingual</span>
    </button>
    <button class="btn btn-ntpc" onclick="startExam('ntpc')">
      Railway NTPC सेक्शनल मॉक टेस्ट
      <span class="btn-sub">Maths, Reasoning, GA | +1 / -0.33 | Bilingual</span>
    </button>
  </div>
</div>

<!-- 2. टेस्ट स्क्रीन -->
<div class="card hidden" id="test-screen">
  <div class="top-bar">
    <span class="exam-name" id="exam-title">SSC CGL</span>
    <div class="top-controls">
      <button class="icon-btn" id="lang-btn" onclick="toggleLang()">EN</button>
      <button class="icon-btn" id="theme-btn-test" onclick="toggleTheme()">🌙</button>
      <span class="timer" id="timer">10:00</span>
      <button class="btn-top-submit" onclick="submitTest()">सबमिट</button>
    </div>
  </div>

  <div class="sec-tabs" id="sec-tabs"></div>
  <div class="palette" id="palette"></div>
  <div class="legend">
    <span><i class="dot" style="background:var(--success)"></i>हल किया</span>
    <span><i class="dot" style="background:var(--danger)"></i>छोड़ा</span>
    <span><i class="dot" style="background:var(--purple)"></i>रिव्यू</span>
    <span><i class="dot" style="background:var(--border)"></i>देखा नहीं</span>
  </div>

  <div class="q-meta">
    <span id="q-count">सवाल 1 / 3</span>
    <span id="q-marks">+2 / -0.5</span>
  </div>
  <div class="q-text" id="q-text"></div>
  <div id="options-box"></div>

  <div class="action-btns">
    <button class="act-btn btn-clear" onclick="clearResponse()">जवाब हटाएँ</button>
    <button class="act-btn btn-review" id="review-btn" onclick="toggleReview()">Mark for Review</button>
  </div>

  <div class="nav-btns">
    <button class="nav-btn btn-prev" id="prev-btn" onclick="prevQ()">पिछला</button>
    <button class="nav-btn btn-next" id="next-btn" onclick="nextQ()">सेव और अगला</button>
  </div>
</div>

<!-- 3. रिज़ल्ट स्क्रीन -->
<div class="card hidden" id="result-screen">
  <div class="app-header">
    <span class="brand">रिज़ल्ट एनालिसिस</span>
    <div class="top-controls">
      <button class="icon-btn" id="lang-btn-res" onclick="toggleLang()">EN</button>
      <button class="icon-btn" id="theme-btn-res" onclick="toggleTheme()">🌙</button>
    </div>
  </div>

  <div class="score-box">
    <div style="font-size:0.9rem; color:var(--muted);">कुल स्कोर</div>
    <div class="score-num" id="final-score">0</div>
    <div class="stats">
      <span class="correct">सही: <b id="res-correct">0</b></span>
      <span class="wrong">गलत: <b id="res-wrong">0</b></span>
      <span>छोड़े: <b id="res-skip">0</b></span>
      <span>सटीकता: <b id="res-acc">0%</b></span>
    </div>
  </div>

  <table>
    <thead>
      <tr><th>सेक्शन</th><th>सही</th><th>गलत</th><th>स्कोर</th></tr>
    </thead>
    <tbody id="sec-table-body"></tbody>
  </table>

  <div id="review-box"></div>
  <button class="btn btn-ssc" style="margin-top:15px; text-align:center;" onclick="goHome()">होम पेज पर जाएँ</button>
</div>

<script>
  const exams = {
    ssc: {
      name: "SSC CGL मॉक टेस्ट",
      pos: 2, neg: 0.5, time: 600,
      sections: [
        {
          name: "Maths", allowLang: true,
          questions: [
            {
              q: { hi: "यदि sin θ = 1/2 है, तो cos 2θ का मान क्या होगा?", en: "If sin θ = 1/2, what is the value of cos 2θ?" },
              opts: { hi: ["1/2", "√3/2", "1", "0"], en: ["1/2", "√3/2", "1", "0"] }, ans: 0,
              exp: { hi: "sin θ = 1/2 ⇒ θ = 30°। अतः cos 2θ = cos 60° = 1/2।", en: "Since sin θ = 1/2, θ = 30°. Therefore, cos 2θ = cos 60° = 1/2." }
            },
            {
              q: { hi: "किसी वस्तु को ₹480 में बेचने पर 20% का लाभ होता है, तो उसका क्रय मूल्य क्या है?", en: "By selling an article for ₹480, there is a profit of 20%. Find its cost price." },
              opts: { hi: ["₹380", "₹400", "₹420", "₹450"], en: ["₹380", "₹400", "₹420", "₹450"] }, ans: 1,
              exp: { hi: "क्रय मूल्य (CP) = (480 × 100) / 120 = ₹400।", en: "Cost Price (CP) = (480 × 100) / 120 = ₹400." }
            },
            {
              q: { hi: "यदि x + 1/x = 5 है, तो x² + 1/x² का मान क्या होगा?", en: "If x + 1/x = 5, then what is the value of x² + 1/x²?" },
              opts: { hi: ["25", "23", "27", "21"], en: ["25", "23", "27", "21"] }, ans: 1,
              exp: { hi: "सूत्र: x² + 1/x² = k² - 2 = 5² - 2 = 23।", en: "Formula: x² + 1/x² = k² - 2 = 5² - 2 = 23." }
            }
          ]
        },
        {
          name: "Reasoning", allowLang: true,
          questions: [
            {
              q: { hi: "श्रृंखला पूरी करें: 2, 6, 12, 20, 30, ?", en: "Complete the series: 2, 6, 12, 20, 30, ?" },
              opts: { hi: ["38", "40", "42", "44"], en: ["38", "40", "42", "44"] }, ans: 2,
              exp: { hi: "अंतर क्रमशः +4, +6, +8, +10, +12 है। अतः 30 + 12 = 42।", en: "Differences increase by +2: +4, +6, +8, +10, +12. So 30 + 12 = 42." }
            },
            {
              q: { hi: "यदि CAT = 24 है, तो DOG का मान क्या होगा?", en: "If CAT = 24, then what is the value of DOG?" },
              opts: { hi: ["24", "26", "28", "30"], en: ["24", "26", "28", "30"] }, ans: 1,
              exp: { hi: "C(3)+A(1)+T(20) = 24। इसी प्रकार D(4)+O(15)+G(7) = 26।", en: "C(3)+A(1)+T(20) = 24. Similarly, D(4)+O(15)+G(7) = 26." }
            },
            {
              q: { hi: "निम्न में से विषम (Odd one out) चुनें:", en: "Select the odd one out from the following:" },
              opts: { hi: ["जयपुर", "भोपाल", "लखनऊ", "कानपुर"], en: ["Jaipur", "Bhopal", "Lucknow", "Kanpur"] }, ans: 3,
              exp: { hi: "जयपुर, भोपाल और लखनऊ राज्यों की राजधानियाँ हैं, कानपुर नहीं।", en: "Jaipur, Bhopal, and Lucknow are state capitals, whereas Kanpur is not." }
            }
          ]
        },
        {
          name: "GS", allowLang: true,
          questions: [
            {
              q: { hi: "भारतीय संविधान के किस अनुच्छेद में 'वित्तीय आपातकाल' का प्रावधान है?", en: "Which Article of the Indian Constitution provides for 'Financial Emergency'?" },
              opts: { hi: ["अनुच्छेद 352", "अनुच्छेद 356", "अनुच्छेद 360", "अनुच्छेद 368"], en: ["Article 352", "Article 356", "Article 360", "Article 368"] }, ans: 2,
              exp: { hi: "अनुच्छेद 360 में वित्तीय आपातकाल का प्रावधान है।", en: "Article 360 deals with Financial Emergency." }
            },
            {
              q: { hi: "हड़प्पा सभ्यता का प्रसिद्ध बंदरगाह 'लोथल' किस राज्य में स्थित है?", en: "In which state is the famous Harappan port 'Lothal' located?" },
              opts: { hi: ["राजस्थान", "गुजरात", "पंजाब", "हरियाणा"], en: ["Rajasthan", "Gujarat", "Punjab", "Haryana"] }, ans: 1,
              exp: { hi: "लोथल गुजरात में भोगवा नदी के किनारे स्थित था।", en: "Lothal was located on the banks of the Bhogava river in Gujarat." }
            },
            {
              q: { hi: "रक्त का थक्का जमाने में कौन-सा विटामिन सहायक होता है?", en: "Which vitamin helps in blood clotting?" },
              opts: { hi: ["विटामिन A", "विटामिन C", "विटामिन D", "विटामिन K"], en: ["Vitamin A", "Vitamin C", "Vitamin D", "Vitamin K"] }, ans: 3,
              exp: { hi: "विटामिन K रक्त का थक्का जमाने में मदद करता है।", en: "Vitamin K (Phylloquinone) is essential for blood clotting." }
            }
          ]
        },
        {
          name: "English", allowLang: false,
          questions: [
            {
              q: { hi: "One Word Substitution: A doctor who treats children's diseases.", en: "One Word Substitution: A doctor who treats children's diseases." },
              opts: { hi: ["Cardiologist", "Paediatrician", "Dermatologist", "Neurologist"], en: ["Cardiologist", "Paediatrician", "Dermatologist", "Neurologist"] }, ans: 1,
              exp: { hi: "Paediatrician means a doctor who specializes in children's diseases.", en: "Paediatrician means a doctor who specializes in children's diseases." }
            },
            {
              q: { hi: "Choose the synonym of 'ABUNDANT':", en: "Choose the synonym of 'ABUNDANT':" },
              opts: { hi: ["Scarce", "Plentiful", "Rare", "Empty"], en: ["Scarce", "Plentiful", "Rare", "Empty"] }, ans: 1,
              exp: { hi: "'Abundant' means existing in large quantities, so 'Plentiful' is the correct synonym.", en: "'Abundant' means existing in large quantities, so 'Plentiful' is the correct synonym." }
            },
            {
              q: { hi: "Fill in the blank: He has been living here ___ 2020.", en: "Fill in the blank: He has been living here ___ 2020." },
              opts: { hi: ["for", "from", "since", "by"], en: ["for", "from", "since", "by"] }, ans: 2,
              exp: { hi: "'Since' is used for a specific point of time (2020).", en: "'Since' is used for a specific point of time (2020)." }
            }
          ]
        }
      ]
    },
    ntpc: {
      name: "Railway NTPC मॉक टेस्ट",
      pos: 1, neg: 0.33, time: 480,
      sections: [
        {
          name: "Maths", allowLang: true,
          questions: [
            {
              q: { hi: "120 का 25% कितना होगा?", en: "What is 25% of 120?" },
              opts: { hi: ["25", "30", "35", "40"], en: ["25", "30", "35", "40"] }, ans: 1,
              exp: { hi: "120 × (25 / 100) = 30।", en: "120 × (25 / 100) = 30." }
            },
            {
              q: { hi: "एक ट्रेन 72 km/h की चाल से चल रही है, इसकी चाल m/s में क्या होगी?", en: "A train is running at 72 km/h. What is its speed in m/s?" },
              opts: { hi: ["15 m/s", "20 m/s", "25 m/s", "18 m/s"], en: ["15 m/s", "20 m/s", "25 m/s", "18 m/s"] }, ans: 1,
              exp: { hi: "72 × (5 / 18) = 20 m/s।", en: "To convert km/h to m/s, multiply by 5/18: 72 × 5/18 = 20 m/s." }
            },
            {
              q: { hi: "12 और 18 का लघुत्तम समापवर्त्य (LCM) क्या होगा?", en: "What is the LCM of 12 and 18?" },
              opts: { hi: ["24", "36", "48", "72"], en: ["24", "36", "48", "72"] }, ans: 1,
              exp: { hi: "12 और 18 का सबसे छोटा समापवर्त्य 36 है।", en: "The least common multiple of 12 and 18 is 36." }
            }
          ]
        },
        {
          name: "Reasoning", allowLang: true,
          questions: [
            {
              q: { hi: "दर्पण में देखने पर घड़ी में 3:00 बजे का समय कैसा दिखाई देगा?", en: "What time will 3:00 on a clock appear to be in a mirror?" },
              opts: { hi: ["6:00", "9:00", "12:00", "3:00"], en: ["6:00", "9:00", "12:00", "3:00"] }, ans: 1,
              exp: { hi: "12:00 - 3:00 = 9:00।", en: "Subtract from 12:00: 12:00 - 3:00 = 9:00." }
            },
            {
              q: { hi: "पुस्तक : पुस्तकालय :: वृक्ष : ?", en: "Book : Library :: Tree : ?" },
              opts: { hi: ["फल", "पत्ती", "वन", "जड़"], en: ["Fruit", "Leaf", "Forest", "Root"] }, ans: 2,
              exp: { hi: "पुस्तकों के समूह से पुस्तकालय और वृक्षों के समूह से वन बनता है।", en: "A collection of books is a Library; a collection of trees is a Forest." }
            },
            {
              q: { hi: "श्रृंखला पूरी करें: A, C, F, J, O, ?", en: "Complete the series: A, C, F, J, O, ?" },
              opts: { hi: ["S", "T", "U", "V"], en: ["S", "T", "U", "V"] }, ans: 2,
              exp: { hi: "अंतर +2, +3, +4, +5, +6 है। अतः O(15) + 6 = U(21)।", en: "Pattern is +2, +3, +4, +5, +6. So O(15) + 6 = U(21)." }
            }
          ]
        },
        {
          name: "General Awareness", allowLang: true,
          questions: [
            {
              q: { hi: "भारत में पहली रेलगाड़ी 1853 में किन दो शहरों के बीच चली थी?", en: "Between which two cities did the first train in India run in 1853?" },
              opts: { hi: ["दिल्ली से आगरा", "मुंबई से ठाणे", "कोलकाता से हावड़ा", "चेन्नई से बेंगलुरु"], en: ["Delhi to Agra", "Mumbai to Thane", "Kolkata to Howrah", "Chennai to Bengaluru"] }, ans: 1,
              exp: { hi: "पहली यात्री ट्रेन 16 अप्रैल 1853 को मुंबई से ठाणे चली थी।", en: "India's first passenger train ran from Mumbai to Thane on 16 April 1853." }
            },
            {
              q: { hi: "विद्युत धारा (Electric Current) का SI मात्रक क्या है?", en: "What is the SI unit of Electric Current?" },
              opts: { hi: ["वोल्ट", "ओम", "एम्पियर", "वाट"], en: ["Volt", "Ohm", "Ampere", "Watt"] }, ans: 2,
              exp: { hi: "विद्युत धारा का SI मात्रक एम्पियर है।", en: "The SI unit of electric current is Ampere." }
            },
            {
              q: { hi: "कोशिका की 'आत्महत्या की थैली' किसे कहा जाता है?", en: "Which organelle is known as the 'Suicidal Bag' of the cell?" },
              opts: { hi: ["माइटोकॉन्ड्रिया", "लाइसोसोम", "राइबोसोम", "केंद्रक"], en: ["Mitochondria", "Lysosome", "Ribosome", "Nucleus"] }, ans: 1,
              exp: { hi: "लाइसोसोम में पाचक एंजाइम होते हैं जो क्षतिग्रस्त कोशिका को नष्ट कर देते हैं।", en: "Lysosomes contain digestive enzymes that can break down damaged cells." }
            }
          ]
        }
      ]
    }
  };

  let curExam, curSec = 0, curQ = 0, userAns = [], marked = [], visited = [], timerInt, timeLeft;
  let lang = 'hi', isDark = false, isResultView = false;

  function toggleTheme() {
    isDark = !isDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.getElementById('theme-btn-home').innerText = isDark ? '☀️ Light' : '🌙 Dark';
    document.getElementById('theme-btn-test').innerText = isDark ? '☀️' : '🌙';
    document.getElementById('theme-btn-res').innerText = isDark ? '☀️' : '🌙';
  }

  function toggleLang() {
    lang = (lang === 'hi') ? 'en' : 'hi';
    document.getElementById('lang-btn').innerText = lang === 'hi' ? 'EN' : 'हिंदी';
    document.getElementById('lang-btn-res').innerText = lang === 'hi' ? 'EN' : 'हिंदी';
    if (isResultView) renderResultContent();
    else renderAll();
  }

  function startExam(type) {
    curExam = exams[type];
    curSec = 0; curQ = 0; isResultView = false;
    userAns = curExam.sections.map(s => new Array(s.questions.length).fill(null));
    marked = curExam.sections.map(s => new Array(s.questions.length).fill(false));
    visited = curExam.sections.map(s => new Array(s.questions.length).fill(false));
    visited[0][0] = true;
    timeLeft = curExam.time;

    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('test-screen').classList.remove('hidden');
    document.getElementById('exam-title').innerText = curExam.name;
    document.getElementById('q-marks').innerText = `+${curExam.pos} / -${curExam.neg}`;

    startTimer();
    renderAll();
  }

  function startTimer() {
    clearInterval(timerInt);
    timerInt = setInterval(() => {
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      document.getElementById('timer').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
      if (timeLeft <= 0) submitTest();
      timeLeft--;
    }, 1000);
  }

  function renderTabs() {
    const tabs = document.getElementById('sec-tabs');
    tabs.innerHTML = '';
    curExam.sections.forEach((sec, idx) => {
      const btn = document.createElement('button');
      btn.className = 'sec-tab' + (idx === curSec ? ' active' : '');
      btn.innerText = sec.name;
      btn.onclick = () => { curSec = idx; curQ = 0; visited[curSec][0] = true; renderAll(); };
      tabs.appendChild(btn);
    });
  }

  function renderPalette() {
    const pal = document.getElementById('palette');
    pal.innerHTML = '';
    curExam.sections[curSec].questions.forEach((_, i) => {
      const btn = document.createElement('button');
      btn.innerText = i + 1;
      let cls = 'p-btn ';
      if (marked[curSec][i] && userAns[curSec][i] !== null) cls += 'p-ans-marked';
      else if (marked[curSec][i]) cls += 'p-marked';
      else if (userAns[curSec][i] !== null) cls += 'p-answered';
      else if (visited[curSec][i]) cls += 'p-not-answered';
      else cls += 'p-not-visited';
      if (i === curQ) cls += ' p-active';
      btn.className = cls;
      btn.onclick = () => { curQ = i; visited[curSec][i] = true; renderAll(); };
      pal.appendChild(btn);
    });
  }

  function renderAll() {
    visited[curSec][curQ] = true;
    const sec = curExam.sections[curSec];
    const q = sec.questions[curQ];
    const activeLang = sec.allowLang ? lang : 'en';

    const langBtn = document.getElementById('lang-btn');
    langBtn.disabled = !sec.allowLang;
    langBtn.innerText = sec.allowLang ? (lang === 'hi' ? 'EN' : 'हिंदी') : 'EN Only';

    renderTabs();
    renderPalette();

    document.getElementById('q-count').innerText = `${sec.name} - Q ${curQ + 1} / ${sec.questions.length}`;
    document.getElementById('q-text').innerText = q.q[activeLang];

    const box = document.getElementById('options-box');
    box.innerHTML = '';
    q.opts[activeLang].forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option' + (userAns[curSec][curQ] === i ? ' selected' : '');
      btn.innerText = opt;
      btn.onclick = () => { userAns[curSec][curQ] = i; renderAll(); };
      box.appendChild(btn);
    });

    const revBtn = document.getElementById('review-btn');
    if (marked[curSec][curQ]) {
      revBtn.classList.add('active-mark');
      revBtn.innerText = 'रिव्यू में है ✓';
    } else {
      revBtn.classList.remove('active-mark');
      revBtn.innerText = 'Mark for Review';
    }

    const isFirst = (curSec === 0 && curQ === 0);
    const isLast = (curSec === curExam.sections.length - 1 && curQ === sec.questions.length - 1);
    document.getElementById('prev-btn').style.visibility = isFirst ? 'hidden' : 'visible';
    document.getElementById('next-btn').innerText = isLast ? 'सबमिट करें' : 'सेव और अगला';
  }

  function clearResponse() { userAns[curSec][curQ] = null; renderAll(); }
  function toggleReview() { marked[curSec][curQ] = !marked[curSec][curQ]; renderAll(); }

  function prevQ() {
    if (curQ > 0) curQ--;
    else if (curSec > 0) { curSec--; curQ = curExam.sections[curSec].questions.length - 1; }
    renderAll();
  }

  function nextQ() {
    const secLen = curExam.sections[curSec].questions.length;
    if (curQ < secLen - 1) { curQ++; renderAll(); }
    else if (curSec < curExam.sections.length - 1) { curSec++; curQ = 0; renderAll(); }
    else submitTest();
  }

  function submitTest() {
    clearInterval(timerInt);
    isResultView = true;
    renderResultContent();
    document.getElementById('test-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
  }

  function renderResultContent() {
    let totalCorrect = 0, totalWrong = 0, totalSkip = 0;
    const tblBody = document.getElementById('sec-table-body');
    const revBox = document.getElementById('review-box');
    tblBody.innerHTML = '';
    revBox.innerHTML = '';

    curExam.sections.forEach((sec, sIdx) => {
      let sCor = 0, sWrg = 0;
      const activeLang = sec.allowLang ? lang : 'en';
      revBox.innerHTML += `<div class="sec-heading">${sec.name}</div>`;

      sec.questions.forEach((q, qIdx) => {
        const ua = userAns[sIdx][qIdx];
        let status = '';
        if (ua === null) { totalSkip++; status = 'छोड़ा गया'; }
        else if (ua === q.ans) { totalCorrect++; sCor++; status = '<span class="correct">सही</span>'; }
        else { totalWrong++; sWrg++; status = '<span class="wrong">गलत</span>'; }

        revBox.innerHTML += `
          <div class="review-item">
            <b>${qIdx+1}. ${q.q[activeLang]}</b><br>
            आपका जवाब: ${ua !== null ? q.opts[activeLang][ua] : 'कोई नहीं'} (${status})<br>
            <span class="correct">सही जवाब: ${q.opts[activeLang][q.ans]}</span>
            <div class="exp-box"><b>सॉल्यूशन:</b> ${q.exp[activeLang]}</div>
          </div>`;
      });

      const sScore = (sCor * curExam.pos) - (sWrg * curExam.neg);
      tblBody.innerHTML += `
        <tr>
          <td><b>${sec.name}</b></td>
          <td class="correct">${sCor}</td>
          <td class="wrong">${sWrg}</td>
          <td><b>${sScore.toFixed(2)}</b></td>
        </tr>`;
    });

    const totalScore = (totalCorrect * curExam.pos) - (totalWrong * curExam.neg);
    const attempted = totalCorrect + totalWrong;
    const acc = attempted > 0 ? Math.round((totalCorrect / attempted) * 100) : 0;

    document.getElementById('final-score').innerText = totalScore.toFixed(2);
    document.getElementById('res-correct').innerText = totalCorrect;
    document.getElementById('res-wrong').innerText = totalWrong;
    document.getElementById('res-skip').innerText = totalSkip;
    document.getElementById('res-acc').innerText = acc + '%';
  }

  function goHome() {
    isResultView = false;
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('home-screen').classList.remove('hidden');
  }
</script>
</body>
</html>
